# DRAFT ONLY. Root reviews/publishes/runs through existing exact-head ownership.
name: GW release dependency preparation
on:
  workflow_dispatch:
  push:
    branches: ['grnwht/family-app-20261004']
    paths: ['.github/workflows/gw-release-dependency-preparation.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_update_notifier: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_ignore_scripts: 'true'
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact existing frontend and backend dependency inputs
        run: |
          mkdir -p dependency-evidence/frontend dependency-evidence/backend
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={
            'package.json':'3db5f0a051f697448cd91b46f811cbb978955b1a739fddeca345e111add5ba1b',
            'package-lock.json':'35a6cb2e836b94d4793a6efe28c5085f8b67c361c874f96ecda2d2aac6933d34',
            'backend/package.json':'2d843ffaafaa094d9a78598b1b0153654f8f8140ed3ac7318e8a80e912614c0b',
            'backend/package-lock.json':'4fe815c1839257ecc86ffd65db8d134a81c824a55180c2b322c9029b777b13d4'
          };
          for(const [file,hash] of Object.entries(expected))if(createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==hash)throw Error('Dependency input drift: '+file);
          fs.writeFileSync('dependency-evidence/input-provenance.json',JSON.stringify({workflowSha:process.env.GITHUB_SHA,baselineSource:'44b05b5d6697096798aa15b3a74a3d065ffb02f3',node:process.version,inputs:expected},null,2));
          for(const [folder,prefix] of [['frontend',''],['backend','backend/']]){
            fs.copyFileSync(prefix+'package.json','dependency-evidence/'+folder+'/original-package.json');
            fs.copyFileSync(prefix+'package-lock.json','dependency-evidence/'+folder+'/original-package-lock.json');
          }
          JS
      - name: Read exact official registry metadata
        run: |
          npm view web-push@3.6.7 version dist.integrity dist.tarball repository.url engines --json > dependency-evidence/backend/web-push-metadata.json
          for package in core pm react starter-kit markdown; do
            npm view "@tiptap/$package@3.30.3" version dist.integrity dist.tarball repository.url engines --json > "dependency-evidence/frontend/tiptap-$package-metadata.json"
          done
      - name: Generate authentic backend lock, without lifecycle scripts
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --save-exact web-push@3.6.7
      - name: Generate authentic frontend lock, without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact @tiptap/core@3.30.3 @tiptap/pm@3.30.3 @tiptap/react@3.30.3 @tiptap/starter-kit@3.30.3 @tiptap/markdown@3.30.3
      - name: Verify manifest scope, npm metadata and registry integrity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tasks=[{folder:'backend',prefix:'backend/',packages:{'web-push':'3.6.7'}},{folder:'frontend',prefix:'',packages:Object.fromEntries(['core','pm','react','starter-kit','markdown'].map(name=>['@tiptap/'+name,'3.30.3']))}];
          const canonical=value=>JSON.stringify(value,(_key,item)=>item&&typeof item==='object'&&!Array.isArray(item)?Object.fromEntries(Object.keys(item).sort().map(key=>[key,item[key]])):item);
          for(const task of tasks){
            const manifest=JSON.parse(fs.readFileSync(task.prefix+'package.json')),lock=JSON.parse(fs.readFileSync(task.prefix+'package-lock.json'));
            const before=JSON.parse(fs.readFileSync('dependency-evidence/'+task.folder+'/original-package.json'));
            const expected=structuredClone(before);expected.dependencies={...expected.dependencies,...task.packages};
            if(canonical(manifest)!==canonical(expected))throw Error('Manifest changed beyond requested dependencies: '+task.folder);
            if(canonical(lock.packages[''].dependencies)!==canonical(expected.dependencies))throw Error('Manifest/root-lock mismatch: '+task.folder);
            const reviews=[];
            for(const [name,version] of Object.entries(task.packages)){
              const file=name==='web-push'?'web-push-metadata.json':'tiptap-'+name.split('/')[1]+'-metadata.json';
              const metadata=JSON.parse(fs.readFileSync('dependency-evidence/'+task.folder+'/'+file)),item=lock.packages['node_modules/'+name];
              if(manifest.dependencies[name]!==version||item?.version!==version||!item.integrity?.startsWith('sha512-'))throw Error('Unexpected resolution: '+name);
              if(metadata.version!==version||metadata['dist.integrity']!==item.integrity||metadata['dist.tarball']!==item.resolved)throw Error('Registry/lock mismatch: '+name);
              const repository=String(metadata['repository.url']).replace(/^git\+/,'').replace(/\.git$/,'');
              if(repository!==(name==='web-push'?'https://github.com/web-push-libs/web-push':'https://github.com/ueberdosis/tiptap'))throw Error('Unexpected official repository: '+name);
              reviews.push({name,version,integrity:item.integrity,resolved:item.resolved,dependencies:item.dependencies,peerDependencies:item.peerDependencies});
            }
            for(const [name,pkg] of Object.entries(lock.packages))if(name&&pkg.resolved&&!pkg.resolved.startsWith('https://registry.npmjs.org/'))throw Error('Unexpected registry source: '+name);
            fs.writeFileSync('dependency-evidence/'+task.folder+'/lock-review.json',JSON.stringify(reviews,null,2));
          }
          JS
      - name: Install frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install backend dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Create fail-closed import-only verification guard
        run: |
          cat > dependency-evidence/import-guard.cjs <<'JS'
          'use strict';
          const deny=()=>{throw Error('Dependency smoke forbids network, servers, browser and subprocesses')};
          for(const [name,methods] of Object.entries({net:['connect','createConnection'],tls:['connect'],http:['request','get'],https:['request','get'],http2:['connect'],dgram:['createSocket'],dns:['lookup','lookupService','resolve','resolve4','resolve6','resolveAny','resolveCname','resolveMx','resolveNaptr','resolveNs','resolvePtr','resolveSoa','resolveSrv','resolveTxt','reverse']})){const api=require('node:'+name);for(const method of methods)if(typeof api[method]==='function')api[method]=deny}
          require('node:net').Socket.prototype.connect=deny;require('node:net').Server.prototype.listen=deny;
          for(const key of Object.keys(require('node:dns').promises))if(typeof require('node:dns').promises[key]==='function')require('node:dns').promises[key]=deny;
          globalThis.fetch=deny;globalThis.WebSocket=class{constructor(){deny()}};
          for(const method of ['spawn','spawnSync','exec','execSync','execFile','execFileSync','fork'])require('node:child_process')[method]=deny;
          require('node:worker_threads').Worker=class{constructor(){deny()}};
          const moduleApi=require('node:module');moduleApi.registerHooks({resolve(name,context,next){if(/playwright|puppeteer|selenium|chromium|webkit|webdriver/i.test(name))deny();return next(name,context)}});moduleApi.syncBuiltinESMExports();
          JS
      - name: Verify backend standard API only, no signing keys or sends
        working-directory: backend
        run: |
          node --require ../dependency-evidence/import-guard.cjs --input-type=module <<'JS'
          import fs from 'node:fs';
          const module=await import('web-push'),library=module.default||module;
          if(typeof library.generateRequestDetails!=='function')throw Error('Missing standard request-generation API');
          fs.writeFileSync('../dependency-evidence/backend/import.json',JSON.stringify({imported:true,generateRequestDetails:true,keysCreated:false,sends:0}));
          JS
      - name: Verify frontend exports and pure parser only, no DOM/browser
        run: |
          node --require ./dependency-evidence/import-guard.cjs --input-type=module <<'JS'
          import fs from 'node:fs';
          const core=await import('@tiptap/core'),react=await import('@tiptap/react'),pmState=await import('@tiptap/pm/state'),pmModel=await import('@tiptap/pm/model'),starter=(await import('@tiptap/starter-kit')).default,markdown=await import('@tiptap/markdown');
          if(typeof core.Extension!=='function'||typeof react.EditorContent==='undefined'||typeof react.useEditor!=='function'||typeof pmState.Plugin!=='function'||typeof pmModel.Slice!=='function'||typeof starter.configure!=='function'||typeof markdown.MarkdownManager!=='function'||!markdown.Markdown)throw Error('Missing requested maintained editor exports');
          const manager=new markdown.MarkdownManager({extensions:[starter.configure({underline:false,trailingNode:false})],markedOptions:{gfm:true,breaks:false}});
          if(manager.serialize(manager.parse('Family news'))!=='Family news')throw Error('Pure parser smoke failed');
          fs.writeFileSync('dependency-evidence/frontend/import.json',JSON.stringify({imported:true,pureParserRoundtrip:true,browserLaunched:false,editorMounted:false}));
          JS
      - name: Collect generated dependency files and exact diffs
        run: |
          cp package.json package-lock.json dependency-evidence/frontend/
          cp backend/package.json backend/package-lock.json dependency-evidence/backend/
          git diff -- package.json package-lock.json > dependency-evidence/frontend/manifest-lock.patch
          git diff -- backend/package.json backend/package-lock.json > dependency-evidence/backend/manifest-lock.patch
          git diff --stat -- package.json package-lock.json backend/package.json backend/package-lock.json > dependency-evidence/diff-stat.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const files=['frontend/package.json','frontend/package-lock.json','backend/package.json','backend/package-lock.json'];
          fs.writeFileSync('dependency-evidence/output-hashes.json',JSON.stringify(Object.fromEntries(files.map(path=>[path,createHash('sha256').update(fs.readFileSync('dependency-evidence/'+path)).digest('hex')])),null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gw-release-dependencies-${{ github.sha }}
          path: dependency-evidence
          retention-days: 7

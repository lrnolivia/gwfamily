name: GW Family quality
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: gw-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      GW_BROWSER: ${{ matrix.browser }}
      GW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/prepare-assets.mjs
      - id: frontend_build
        run: npm run build
      - run: node scripts/ci-test-summary.mjs frontend
      - run: npm ci --ignore-scripts
        working-directory: backend
      - id: backend_build
        run: node ../scripts/ci-test-summary.mjs backend && node ../scripts/ci-test-summary.mjs backend-build --build
        working-directory: backend
      - id: browser_install
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Full recovery browser checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/gw-http.log 2>&1 &
          node scripts/ci-test-summary.mjs recovery-browser --browser tests/recovery-browser.mjs
          node scripts/ci-test-summary.mjs hotfix-browser --browser tests/hotfix-browser.mjs
      - name: Live API integration browser checks
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' && steps.backend_build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: |
          node backend/tests/fixture-server.mjs > /tmp/gw-fixture.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/api/config && break; sleep 1; done
          node scripts/ci-test-summary.mjs media-browser --browser tests/media-browser.mjs
          node scripts/ci-test-summary.mjs live-browser --browser tests/live-browser.mjs
      - name: Private communications browser checks
        if: always() && steps.frontend_build.outcome == 'success' && steps.backend_build.outcome == 'success'
        timeout-minutes: 10
        run: |
          node backend/tests/communications-fixture-server.mjs > /tmp/gw-communications-fixture.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/api/config && break; sleep 1; done
          CI=true node scripts/ci-test-summary.mjs communications-browser --browser tests/communications-browser.mjs
      - name: Device-aware navigation geometry checks
        if: always() && steps.frontend_build.outcome == 'success'
        timeout-minutes: 6
        run: |
          if ! curl -fsS http://127.0.0.1:4173/; then
            python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/gw-http.log 2>&1 &
          fi
          CI=true node scripts/ci-test-summary.mjs navigation-insets-browser --browser tests/navigation-insets-browser.mjs
      - name: Shared page editor browser checks
        if: always() && steps.frontend_build.outcome == 'success' && steps.backend_build.outcome == 'success'
        timeout-minutes: 10
        run: |
          node backend/tests/page-content-fixture-server.mjs > /tmp/gw-page-content-fixture.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4176/api/config && break; sleep 1; done
          CI=true node scripts/ci-test-summary.mjs page-content-browser --browser tests/page-content-browser.mjs
      - name: Choice and Send keyboard checks
        if: always() && steps.frontend_build.outcome == 'success'
        timeout-minutes: 6
        run: CI=true node scripts/ci-test-summary.mjs choice-control-browser --browser tests/choice-control-browser.mjs
      - name: Durable activity inbox checks
        if: always() && steps.frontend_build.outcome == 'success'
        timeout-minutes: 6
        run: |
          if ! curl -fsS http://127.0.0.1:4173/; then
            python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/gw-http.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ && break; sleep 1; done
          fi
          CI=true node scripts/ci-test-summary.mjs notifications-browser --browser tests/notifications-browser.mjs
      - name: Guided install and optional help checks
        if: always() && steps.frontend_build.outcome == 'success'
        timeout-minutes: 6
        run: CI=true node scripts/ci-test-summary.mjs install-tutorial-browser --browser tests/install-tutorial-browser.mjs
      - name: Safari same-tab memory upload reload regression
        if: always() && matrix.browser == 'webkit' && steps.frontend_build.outcome == 'success' && steps.backend_build.outcome == 'success'
        timeout-minutes: 5
        run: |
          if ! curl -fsS http://127.0.0.1:4174/api/config; then
            node backend/tests/fixture-server.mjs > /tmp/gw-fixture.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/api/config && break; sleep 1; done
          fi
          node scripts/ci-test-summary.mjs webkit-memory-reload --browser tests/webkit-memory-reload.mjs
      - name: WebKit isolated navigation diagnostics
        if: always() && matrix.browser == 'webkit' && steps.frontend_build.outcome == 'success' && steps.backend_build.outcome == 'success'
        timeout-minutes: 6
        run: node scripts/ci-test-summary.mjs webkit-diagnostics --browser tests/webkit-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gw-family-qa-${{ github.sha }}-${{ matrix.browser }}
          path: |
            docs/recovery-qa
            docs/live-qa
            docs/communications-qa
            docs/navigation-qa
            docs/page-content-qa
            docs/choice-control-qa
            docs/help-qa
            docs/notifications-qa
            backend/build/worker.mjs
            backend/build/worker-provenance.json
          retention-days: 7

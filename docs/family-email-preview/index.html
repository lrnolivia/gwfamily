<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW email previews</title><style>body{margin:0;background:#e7efdf;color:#4b382b;font:16px/1.5 Arial,sans-serif}header{padding:24px;max-width:900px;margin:auto}h1{font-size:28px;margin:0 0 8px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:4px}select,a{color:inherit}select{padding:10px;border:1px solid #715b49;border-radius:8px;background:#fafbf2;font:inherit}main{display:flex;justify-content:center;padding:0 12px 32px}iframe{border:0;width:100%;max-width:800px;height:1100px;background:#fafbf2}a{margin-right:16px}</style><header><h1>Green &amp; White email previews</h1><p>Fictional sample copy. Nothing is sent. These previews demonstrate rendering, not mailbox delivery or a recipient policy.</p><div class="controls"><label>Content<select id="kind" aria-label="Content"><option value="notification">Notification</option><option value="announcement">Announcement</option></select></label><label>Appearance<select id="theme" aria-label="Appearance"><option>light</option><option>dark</option></select></label><label>Heading<select id="font" aria-label="Heading"><option value="sans">Momo Trust Display</option><option value="serif">DM Serif Text</option></select></label><label>Accent<select id="accent" aria-label="Accent"><option>red</option><option>orange</option><option>yellow</option><option>green</option><option>blue</option><option>violet</option><option>coral-pink</option><option>stone</option></select></label><label>Width<select id="width" aria-label="Width"><option value="800">Desktop</option><option value="390">Phone ·390px</option><option value="320">Small phone ·320px</option></select></label><label>Client fallback<select id="fallback" aria-label="Client fallback"><option value="">Full fonts and oak</option><option value="-fallback">Fonts/images blocked ·green or yellow</option></select></label></div><p><a id="html">Open HTML</a><a id="text">Plain text</a></p></header><main><iframe title="Fictional GW email" sandbox="allow-same-origin"></iframe></main><script>const ids=['kind','theme','font','accent','width','fallback'];function update(){const v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));if(v.fallback&&!['green','yellow'].includes(v.accent)){v.accent='green';document.getElementById('accent').value=v.accent}const stem=[v.accent,v.theme,v.font,v.kind].join('-');document.querySelector('iframe').src=stem+v.fallback+'.html';document.querySelector('iframe').style.maxWidth=v.width+'px';document.getElementById('html').href=stem+v.fallback+'.html';document.getElementById('text').href=stem+'.txt'}ids.forEach(id=>document.getElementById(id).addEventListener('change',update));update()</script></html>
